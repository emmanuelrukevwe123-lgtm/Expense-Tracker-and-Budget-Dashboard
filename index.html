<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Expense Tracker</h1>

    <!-- Summary -->
    <section aria-labelledby="summary-heading">
      <h2 id="summary-heading">Summary</h2>
      <dl>
        <dt>Balance</dt>
        <dd><output id="total-balance" aria-live="polite">$0.00</output></dd>

        <dt>Income</dt>
        <dd><output id="total-income" aria-live="polite">$0.00</output></dd>

        <dt>Expenses</dt>
        <dd><output id="total-expense" aria-live="polite">$0.00</output></dd>
      </dl>
    </section>

    <!-- Add transaction -->
    <section aria-labelledby="add-heading">
      <h2 id="add-heading">Add a transaction</h2>

      <form id="add-transaction">
        <p>
          <label for="description">Description</label>
          <input type="text" id="description" name="description" required />
        </p>

        <p>
          <label for="amount">Amount</label>
          <input
            type="number"
            id="amount"
            name="amount"
            min="0.01"
            step="0.01"
            required
          />
        </p>

        <p>
          <label for="date">Date</label>
          <input type="date" id="date" name="date" required />
        </p>

        <p>
          <label for="type">Type</label>
          <select id="type" name="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </p>

        <p>
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="housing">Housing</option>
            <option value="utilities">Utilities</option>
            <option value="entertainment">Entertainment</option>
            <option value="income">Income</option>
            <option value="miscellaneous">Miscellaneous</option>
          </select>
        </p>

        <button type="submit">Add transaction</button>
      </form>
    </section>
    <!-- Filter & Sort -->
    <section aria-labelledby="controls-heading">
      <h2 id="controls-heading">view options</h2>
      <label for="filter">filter</label>
      <select id="filter">
        <option value="all">All transactions</option>
        <option value="income">Income Only</option>
        <option value="expense">Expense Only</option>
      </select>
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="date">by Date</option>
        <option value="amount">by Amount</option>
      </select>
    </section>
    <!-- Transactions -->
    <section aria-labelledby="transactions-heading">
      <h2 id="transactions-heading">Transactions</h2>
      <p id="transactions-empty">
        No transactions yet. Add your first one above.
      </p>
      <ul id="transaction-list"></ul>
    </section>

    <!-- Category breakdown -->
    <section aria-labelledby="breakdown-heading">
      <h2 id="breakdown-heading">Spending by category</h2>
      <p id="breakdown-empty">Nothing to break down yet.</p>
      <ul id="category-breakdown"></ul>
    </section>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
